name: Build PonWrt (ZN504XG-D & HG5585F)

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: 'true'
        type: boolean
      cache_mode:
        description: '编译缓存模式 (使用缓存 / 重新编译 / 不使用缓存)'
        required: false
        default: '使用缓存'
        type: choice
        options:
          - '使用缓存'
          - '重新编译'
          - '不使用缓存'
  push:
    branches:
      - master
    paths:
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - '.github/workflows/build-zn504.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    name: Build ZN504XG-D & HG5585F
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          BEST_MIRROR=""
          for m in \
            https://mirrors.edge.kernel.org/ubuntu \
            http://us.archive.ubuntu.com/ubuntu \
            http://mirror.rackspace.com/ubuntu \
            https://mirror.math.princeton.edu/pub/ubuntu \
            http://archive.ubuntu.com/ubuntu \
            http://azure.archive.ubuntu.com/ubuntu; do
            if curl -4 -fsIL --max-time 5 "$m/dists/noble/InRelease" >/dev/null 2>&1; then
              BEST_MIRROR="$m"
              break
            fi
          done
          if [ -n "$BEST_MIRROR" ]; then
            echo "Selected live Ubuntu mirror: $BEST_MIRROR"
            [ -f /etc/apt/apt-mirrors.txt ] && echo "$BEST_MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            [ -f /etc/apt/sources.list.d/ubuntu.sources ] && sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu#$BEST_MIRROR#g" /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 300 \
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 600 \
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-zn504-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Restore compiler ccache
        if: ${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-
            ponwrt-ccache-zn504-

      - name: Configure for ZN504XG-D
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config
          if [ "${{ github.event.inputs.cache_mode || '使用缓存' }}" != "不使用缓存" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi
          make defconfig

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
          make -j"$(nproc)" || make -j1 V=s

      - name: Save compiler ccache
        if: always() && (${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ponwrt-ccache-zn504-${{ hashFiles('configs/*.config') }}-${{ github.sha }}

      - name: Show compiler cache statistics
        if: always() && (${{ github.event.inputs.cache_mode || '使用缓存' }} != '不使用缓存')
        run: |
          [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -s || true

      - name: Organize output files
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f \( -name "*zn504*" -o -name "*hg5585f-ct*" \) ! -name "*usb-sfp*" \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-ZN504-HG5585F-enhanced-firmware
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: github.event.inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt ZN504XG-D & HG5585F 电信版聚合增强固件 (${{ steps.tag.outputs.release_tag }})
          body: |
            ## 🌟 较上一版 (v2026.11.14-0306) 核心变更与独家差异对比

            | 变更模块 | 上一版状态 (v2026.11.14-0306) | 本版重大升级 (当前版本) | 实机收益与用户感知 |
            | :--- | :--- | :--- | :--- |
            | **电信 4K/8K IPTV 1302 错误** | ❌ 业务口与组播口共用网桥，上游 BNG 相同 MAC 导致 FDB 翻转单播黑洞，机顶盒鉴权超时报 1302 | **独家补丁 `03-pon-userspace-iptv-bridge-mac-fix.patch`**：组播下行口强制 `learning='0'`，动态探测网关 MAC 并静态固化到业务口 | **彻底根除网桥 MAC 表翻转**，机顶盒秒速通过鉴权，4K/8K 组播画质流畅不卡顿 |
            | **YAML CLI 工具链** | ❌ 无轻量级 YAML/JSON 命令行转换工具 | **原生集成高性能 `CONFIG_PACKAGE_yq=y`** | 为复杂订阅规则与自动化网络脚本提供便捷的命令行配置解析能力 |
            | **节点测速与防断流稳定性** | ⚠️ `scheduled_restart` 偶发冷启动导致全节点短暂超时变灰 | **默认关闭定时重启**，优化 `interval: 15m` 与 `tolerance: 35` | 杜绝并发测速打爆电信 CGNAT 状态表，节点全天候 25/25 在线低延迟 |
            | **CI/CD 构建流水线架构** | ⚠️ 无编译器指纹缓存，每次构建耗时长达 2 小时+ | **升级 Ubuntu 24.04 + Ccache 编译器指纹持久化机制 + 5GB 缓存池** | 后续增量构建耗时锐减至 20~30 分钟，出包速度提升 60%+ |
            | **系统纯净度与后台守护** | ⚠️ 内置实验性 `traffic-profiler` 采样工具 | **彻底移除 `traffic-profiler` 与 Crontab 定时器** | 恢复 100% 纯净系统，保持 1.2GHz 全血自适应调度，零后台负载 |

            ---

            ### PonWrt Airoha AN7581 聚合增强固件 (ZN504XG-D & HG5585F 电信版)
            * **适用机型**：
              - **烽火/中移 ZN504XG-D**：纯有线 2.5G 高性能光猫（AN7581 + EN8811H 2.5G 网口）
              - **烽火 HG5585F (CT 电信标准版)**：带 Wi-Fi 6 (MT7916D DBDC AX3000 + NPU WED 硬件加速，标准原生 USB 2.0 硬件配置)
            * **后台管理**：`192.168.1.1`（用户名: `root`，默认无密码）
            * **Wi-Fi 6 / 四核无线亲和性调优 (HG5585F)**：
              - 集成 MediaTek MT7916 驱动与 NPU WED 硬件加速固件 (`en7581_MT7916_npu_rv32.bin`)
              - 预置板载 factory 8192 偏移校准与 `07_an7581_bsp_wifi_mac` 独立 MAC 算号
              - 预置 `SingleSKU` 与 `mt7916-sku.dat` 射频功率校准表
              - **Wi-Fi 四核无线线程绑核与以太网硬中断亲和性** (`/usr/sbin/pin-wifi-cpus.sh` + `/etc/hotplug.d/net/99-wifi-affinity`)：`mt76-tx*` 独占 `CPU3`，`napi/phy0-0` 均衡打散至 `CPU0/1/2`，有线硬中断绑定 `IRQ 17->CPU1`、`IRQ 21->CPU2`（实测 5G Wi-Fi iPerf3 稳定 **1144 Mbps 下行 / 1200 Mbps 上行**）
            * **核心网络与实时音视频保序优化**：
              - 默认开启 Firewall4 软件与硬件 PPE 流卸载（`flow_offloading='1'` / `flow_offloading_hw='1'`），配合 `001-add-bridge-flowtable-support.patch` 完美支持 AP 模式网桥硬件直转与三层路由加速；保持停用多核 `packet_steering='0'` 服务以保护 Wi-Fi 4 核绑定亲和性不受冲刷
              - 启用 Momo 纯核心模式（`core_only='1'`）搭配内核 NFQUEUE，完整遵循用户 `sing-box` 订阅规则及原生 `auto_redirect` + `bypass` 零拷贝直连
              - 网桥放行 LLDP (0x4000)，杜绝下挂 AP 组播心跳导致网桥丢包统计异常
              - 移植 QWRT 内存防碎片参数 (`vm.percpu_pagelist_high_fraction = 128`)，提升高通量多核并发页面分配效率
              - 移植 QWRT SSDP (`239.255.255.250:1900`) 与 WSD (`3702`) `NOTRACK` 局域网广播旁路，防止连接跟踪表与交换芯片 CDM 队列膨胀
              - 统一对齐 `16MB` (`16777216`) TCP/UDP 核心与套接字缓冲区及万兆网络队列扩容（`netdev_max_backlog=16384`, `netdev_budget=600`, `dev_weight=128`），提升软中断吞吐并消除 CPU CDM1 交换队列突发丢包
              - 精细化 CPUFreq 双调度器调优（默认预置 `conservative`，阶跃 10%、门限 70%/30%、平滑驻留倍数 2，温度降至 ~68°C 且无顿挫；兼顾 `ondemand` 75% 门限与 10% 节电偏置），停用未配置硬盘的闲置 Samba4/wsdd2 开箱净省近 50MB 内存
              - 调优 PPE 硬件流表直转门限至 `5 pps`，并修复 `luci-app-airoha-npu` PSE 交换端口队列历史丢包常态化标红缺陷，支持实时丢包检测与一键重置丢包基准
            * **集成 QWRT 核心硬件特性**：
              - Airoha AN7581 NPU / PPE 硬件流量转发加速 (`luci-app-airoha-npu`, `luci-app-hqos`)
              - CPU 调频策略与频率管理 (`luci-app-cpufreq`)
              - 磁盘与存储分区管理 (`luci-app-diskman`)
              - 网页终端 (`luci-app-ttyd`)
            * **第一性原理纯净加解密流水线**：
              - 遵循 ImmortalWrt 官方实践 (da63f7d)，彻底剔除 SafeXcel / EIP-93 协处理器 (`kmod-crypto-hw-eip93`)，杜绝 DMA 缓存颠簸与硬中断抢占，释放 4 核 NEON 极速运算 WireGuard (ChaCha20) 与 Momo 用户态代理
            * **精简纯净架构**：
              - 彻底移除冗余重型插件（Lucky、Samba4、集客AC、WOL、AutoReboot、UPnP、RAMFree），大幅减小固件体积并缩短编译时间
            * **集成 Kahen 项目精华**：
              - 修复 SoC 与光模块温度上报 (`temperature-rpc.uc` + `/sbin/tempinfo` RPC 联动)
              - MTD 读写支持 (`kmod-mtd-rw`)，保障工厂/校准分区备份
              - 响应式 Footstrap 主题与完整 LuCI 简体中文语言包
            * **集成 LeoooChen 项目精华**：
              - XG-PON 线路与 PPPoE 线速硬件流量卸载（千兆带宽 CPU 占用低至约 4.5%）
              - 16MB 高通量网络与 IPTV 环形缓冲区调优，杜绝 4K/8K 组播与突发丢包
            * **电信 4K/8K IPTV 开箱即用与网桥 MAC 翻转 (1302 错误) 独家根治**：
              - **独家根治机顶盒 1302 鉴权超时**：在 `br-iptv` 组播口上默认执行 `learning='0'`，彻底杜绝上游 BNG 相同 MAC 表在组播口翻转引发的单播黑洞，同时动态探测上游网关 MAC 并静态固化到业务口，实现**机顶盒秒速鉴权 + 4K/8K 组播画质双流畅**
              - 首启自动构建异 VLAN 隔离网桥 `br-iptv`（`pon0.45` IGMP 上行 + `pon0.50` 组播下行，启用 `netifd` 原生 `bridge-port isolate='1'` 与 `learning='0'` 防二层环路反射）与 `169.254.50.2/24` 无默认路由 `iptv` 接口及专属 `iptv` 防火墙规则
              - `rtp2httpd` 默认纯端口 `4022` 双栈监听（修复 LuCI 状态/播放器按钮跳转 `0.0.0.0` 问题），上游默认绑定 `br-iptv`，内置 `/www/iptv.m3u` 与 `/playlist.m3u` 订阅入口
              - 原生集成 YAML 处理器 `yq`，全面覆盖局域网自动化配置与订阅需求
            * **CI/CD 构建流水线现代化 (吸收 1018ji/build-ponwrt-daily 精华)**：
              - 升级构建流水线至 Ubuntu 24.04 + Node 24，集成基于编译器版本指纹的 Ccache 高速缓存（`CCACHE_COMPILERCHECK`）与 DL 共享依赖池，编译时间大幅缩短
            * **Momo / Sing-box 透明代理**：
              - 原生集成 `luci-app-momo` 与最新 `sing-box 1.15.0-alpha.13` 预览版核心（支持 `endpoints[].on_demand` 等 1.15+ 新版订阅语法）
              - 预置 128MiB 健康堆内存上限与定时内存整理防爆机制
              - 预置 Momo 完整简体中文汉化语言包
          files: output/*
